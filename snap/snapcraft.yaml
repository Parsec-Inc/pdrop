name: pdrop
base: core24
version: '1.2.1'
summary: AirDrop-style sharing on your local network
description: |
  Run pdrop on two or more machines on the same network and they appear on
  each other's radar. Select a peer and drop files, text or your clipboard to
  them. No accounts, no servers, no cloud.
license: MIT
grade: stable
confinement: strict

apps:
  pdrop:
    command: bin/pdrop
    extensions: [gnome]   # traz wayland, x11, opengl e desktop
    plugs: [network, network-bind, home]

parts:
  rust-deps:
    plugin: nil
    build-packages: [curl]
    override-build: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

  pdrop:
    plugin: rust
    rust-channel: none
    after: [rust-deps]
    source: .
    stage-packages: [wl-clipboard, xclip, libnotify-bin]
    override-build: |
      craftctl default
      install -Dm644 assets/pdrop.png "$CRAFT_PART_INSTALL/meta/gui/pdrop.png"
      sed 's|^Icon=.*|Icon=${SNAP}/meta/gui/pdrop.png|; s|^Exec=.*|Exec=pdrop|' assets/pdrop.desktop \
        > "$CRAFT_PART_INSTALL/meta/gui/pdrop.desktop"
