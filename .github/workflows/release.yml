name: release
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      increment:
        description: Incremento da versão
        required: true
        type: choice
        options: [PATCH, MINOR, MAJOR]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

jobs:
  tests:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.pull_request.merged
    uses: ./.github/workflows/ci.yml

  bump:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.bump.outputs.released }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          set +e
          uvx --from commitizen cz bump --yes ${INCREMENT:+--increment "$INCREMENT"}
          status=$?
          set -e
          if [ "$status" -eq 21 ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          tag="$(git describe --tags --exact-match HEAD)"
          uvx --from commitizen cz changelog "$tag" --dry-run > release-notes.md
          git bundle create bump.bundle "$BASE_SHA..refs/tags/$tag"
          { echo "released=true"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.bump.outputs.released == 'true'
        with: { name: bump, path: bump.bundle }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.bump.outputs.released == 'true'
        with: { name: notes, path: release-notes.md }

  linux:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE_SHA }}", persist-credentials: false }
      - uses: ./.github/actions/release-checkout
        with: { version: "${{ needs.bump.outputs.tag }}" }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with: { tool: "cargo-deb,cargo-generate-rpm" }
      - run: ./scripts/package.sh linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: linux, path: dist/* }

  arch:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE_SHA }}", persist-credentials: false }
      - uses: ./.github/actions/release-checkout
        with: { version: "${{ needs.bump.outputs.tag }}" }
      - run: ./scripts/package.sh arch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: arch, path: dist/* }

  windows:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE_SHA }}", persist-credentials: false }
      - uses: ./.github/actions/release-checkout
        with: { version: "${{ needs.bump.outputs.tag }}" }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: WiX 3
        run: |
          [ -d "/c/Program Files (x86)/WiX Toolset v3.14/bin" ] || choco install wixtoolset --no-progress -y
          echo 'C:\Program Files (x86)\WiX Toolset v3.14\bin' >> "$GITHUB_PATH"
      - run: ./scripts/package.sh msi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: windows, path: dist/* }

  macos:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE_SHA }}", persist-credentials: false }
      - uses: ./.github/actions/release-checkout
        with: { version: "${{ needs.bump.outputs.tag }}" }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: ./scripts/package.sh macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: macos, path: dist/* }

  snap:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    outputs:
      file: ${{ steps.name.outputs.file }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE_SHA }}", persist-credentials: false }
      - uses: ./.github/actions/release-checkout
        with: { version: "${{ needs.bump.outputs.tag }}" }
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: build
      - id: name
        env: { SNAP_FILE: "${{ steps.build.outputs.snap }}" }
        run: echo "file=$(basename "$SNAP_FILE")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: snap, path: "${{ steps.build.outputs.snap }}" }

  release:
    needs: [bump, tests, linux, arch, windows, macos]
    if: ${{ !cancelled() && needs.tests.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE_SHA }}" }
      - uses: ./.github/actions/release-checkout
        with: { version: "${{ needs.bump.outputs.tag }}" }
      - name: Push version commit and tag
        run: git push --atomic origin "$(git rev-parse "$TAG^{commit}"):refs/heads/main" "refs/tags/$TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '{linux,arch,windows,macos,notes}'
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: GitHub release
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release-notes.md ..
          sha256sum -- * > SHA256SUMS
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes-file ../release-notes.md -- *

  snap-release:
    needs: [bump, release, snap]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.snap.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.bump.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: snap, path: snap }
      - name: Anexa à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sums
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D sums
          (cd snap && sha256sum -- *) >> sums/SHA256SUMS
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber snap/* sums/SHA256SUMS
      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        if: ${{ vars.PUBLISH_SNAP == 'true' }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: snap/${{ needs.snap.outputs.file }}
          release: edge

  aur:
    needs: [bump, release]
    if: ${{ vars.PUBLISH_AUR == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ needs.bump.outputs.tag }}" }
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: pdrop
          pkgbuild: ./packaging/arch/PKGBUILD
          updpkgsums: true
          commit_username: ${{ github.actor }}
          commit_email: noreply@github.com
          commit_message: ${{ needs.bump.outputs.tag }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  homebrew:
    needs: [bump, release]
    if: ${{ vars.PUBLISH_BREW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@56a283fa15557e9abaa4bdb63b8212abc68e655c # v3
        with:
          formula-name: pdrop
          homebrew-tap: Parsec-Inc/homebrew-tap
          tag-name: ${{ needs.bump.outputs.tag }}
          download-url: https://github.com/${{ github.repository }}/archive/refs/tags/${{ needs.bump.outputs.tag }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
